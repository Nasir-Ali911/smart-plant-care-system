name: Smart Plant ML Notifications

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  predict-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ML dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r smart_plant_ml/requirements.txt

      - name: Restore Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_B64 }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_B64" | base64 --decode > smart_plant_ml/firebase-service-account.json

      - name: Run ML prediction and notifications
        run: |
          python smart_plant_ml/predict.py --live